name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check development tools
        run: bash scripts/doctor.sh
      - name: Run regression checks
        run: bash scripts/test.sh
      - name: Build and verify app package with native Shortcuts metadata
        env:
          REQUIRE_APP_INTENTS: "1"
        run: bash scripts/build.sh
      - name: Save tested app package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-tested-package
          path: dist/Workbench.zip
          retention-days: 7
          if-no-files-found: error
